[project]
name = "marketradar"
version = "0.1.0"
description = "Personal equities intelligence + private company deal sourcing"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5",
    "httpx>=0.27",
    "pyarrow>=17",
    "pytz>=2026.3.post1",
]

[project.scripts]
mr = "marketradar.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marketradar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
