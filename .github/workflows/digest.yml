name: digest

# The daily email. Triggered by the price sweep *finishing*, not by its own
# clock: a digest rendered mid-sweep is a digest of half the market, and the
# sweep takes ~95 minutes and starts whenever GitHub gets round to it. Last
# week the schedule fired 4h47m late, so any fixed time here would have
# rendered against a partially-written partition.

on:
  workflow_run:
    workflows: ["prices"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only, send nothing"
        required: false
        default: true
        type: boolean

concurrency:
  group: digest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Only after a sweep that actually succeeded. A red sweep leaves the
    # partition mid-rewrite, and a digest of that is worse than no digest --
    # it looks exactly like a normal morning.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Macro
        # Rates and spreads are three requests and change daily; rendering
        # yesterday's macro line beside today's screens would be quietly
        # wrong. Not fatal: the digest reports a stale macro line rather
        # than refusing to send.
        continue-on-error: true
        env:
          MR_FRED_API_KEY: ${{ secrets.MR_FRED_API_KEY }}
          MR_POSTGRES_DSN: ${{ secrets.MR_POSTGRES_DSN }}
        run: uv run mr fred

      - name: Render and send
        id: digest
        env:
          MR_ENV: ci
          MR_R2_ACCOUNT_ID: ${{ secrets.MR_R2_ACCOUNT_ID }}
          MR_R2_ACCESS_KEY_ID: ${{ secrets.MR_R2_ACCESS_KEY_ID }}
          MR_R2_SECRET_ACCESS_KEY: ${{ secrets.MR_R2_SECRET_ACCESS_KEY }}
          MR_R2_BUCKET: ${{ vars.MR_R2_BUCKET || 'market-radar' }}
          MR_POSTGRES_DSN: ${{ secrets.MR_POSTGRES_DSN }}
          MR_RESEND_API_KEY: ${{ secrets.MR_RESEND_API_KEY }}
          MR_DIGEST_FROM: ${{ vars.MR_DIGEST_FROM || 'onboarding@resend.dev' }}
          MR_DIGEST_TO: ${{ secrets.MR_DIGEST_TO }}
        run: |
          uv run mr digest ${{ inputs.dry_run && '--dry-run' || '' }}

      # No `continue-on-error` on the step above. A StaleDataError exits
      # non-zero and the job goes red: an email that renders green off empty
      # screens is the failure this project exists to prevent, and it is
      # worse here than in the sweep because it *looks* like a normal morning.

      # Drift, as against the write. `assert_fresh(published=...)` catches a
      # publish that wrote to the wrong place at the moment it happens; this
      # catches a location that stopped resolving afterwards -- a deleted
      # Release, a renamed tag, a partition declared for data nobody built.
      #
      # Both are needed because they fail at different times. 35 declared
      # locations held nothing for weeks: the write-time check did not exist,
      # and nothing ran a drift check either. Non-zero exit, so this is a gate.
      #
      # `if: always()` because a gate that a *different* step can switch off is
      # not a gate. Measured 2026-09-16: this step had never run in CI. The
      # send above exits non-zero when MR_RESEND_API_KEY is unset, the default
      # `if: success()` skipped this, and six nightly runs reported
      # "manifest verify: skipped" while the drift check the step exists to
      # perform went unperformed. Nothing was red about the manifest -- the
      # manifest was simply never asked.
      #
      # Same shape as `--drop-zips` deleting the reference quarter and taking
      # the XBRL drift test from passing to *skipped* in the same commit: in
      # both, an unrelated change disarms a guard and the disarming is silent
      # because a skipped check looks nothing like a failing one.
      #
      # This runs on its own credentials and reads nothing the digest wrote, so
      # there is no ordering reason for it to depend on the send at all.
      - name: Verify every declared location
        if: always()
        id: manifest
        env:
          MR_R2_ACCOUNT_ID: ${{ secrets.MR_R2_ACCOUNT_ID }}
          MR_R2_ACCESS_KEY_ID: ${{ secrets.MR_R2_ACCESS_KEY_ID }}
          MR_R2_SECRET_ACCESS_KEY: ${{ secrets.MR_R2_SECRET_ACCESS_KEY }}
          MR_R2_BUCKET: ${{ vars.MR_R2_BUCKET || 'market-radar' }}
          MR_POSTGRES_DSN: ${{ secrets.MR_POSTGRES_DSN }}
        run: uv run mr manifest --verify

      - name: Summary
        if: success() || failure()
        run: |
          {
            echo "### digest"
            echo ""
            echo "- outcome: \`${{ steps.digest.outcome }}\`"
            echo "- trigger: \`${{ github.event_name }}\`"
            echo "- upstream sweep: \`${{ github.event.workflow_run.conclusion || 'n/a' }}\`"
            echo "- dry run: \`${{ inputs.dry_run || false }}\`"
            echo "- manifest verify: \`${{ steps.manifest.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
