# Dataset locations. Configuration, not observation — row counts and max dates
# live in Postgres (dataset_stats), written nightly by the loaders.
#
# Moving a dataset is an edit here and nothing else. Nothing in the codebase
# hardcodes a data URL.
#
# backend must be one of: r2 | github_release | supabase | local
#
# LICENSING BOUNDARY (see CLAUDE.md): anything a vendor touched goes to "r2",
# which is private. Only public-domain government data may use
# "github_release", because Release assets on a public repo are world-readable
# and publishing them is redistribution.

# --- vendor-derived: private, R2 only -------------------------------------

[prices_eod_raw]
# Raw unadjusted OHLCV from Tiingo. Adjustment happens at query time against
# corporate_actions, which keeps history immutable and year partitions honest.
#
# One entry per year back to 2016. A single Tiingo request returns a whole
# date range, so a ten-year backfill costs the same 14,124 requests as a
# one-year one -- the depth is free, the partitions are what make it storable.
# A sweep spanning a year boundary writes to both partitions; publish() filters
# staged rows to the partition's own year rather than trusting the caller.
#
# Closed years are immutable once backfilled. They are still asserted on every
# publish, just under a different contract: row count and the year's boundary
# sessions rather than wall-clock staleness, which is meaningless for a year
# that ended. See tiingo._assert_partition_fresh.
2016 = { location = "r2://market-radar/prices_eod_raw/2016.parquet", backend = "r2" }
2017 = { location = "r2://market-radar/prices_eod_raw/2017.parquet", backend = "r2" }
2018 = { location = "r2://market-radar/prices_eod_raw/2018.parquet", backend = "r2" }
2019 = { location = "r2://market-radar/prices_eod_raw/2019.parquet", backend = "r2" }
2020 = { location = "r2://market-radar/prices_eod_raw/2020.parquet", backend = "r2" }
2021 = { location = "r2://market-radar/prices_eod_raw/2021.parquet", backend = "r2" }
2022 = { location = "r2://market-radar/prices_eod_raw/2022.parquet", backend = "r2" }
2023 = { location = "r2://market-radar/prices_eod_raw/2023.parquet", backend = "r2" }
2024 = { location = "r2://market-radar/prices_eod_raw/2024.parquet", backend = "r2" }
2025 = { location = "r2://market-radar/prices_eod_raw/2025.parquet", backend = "r2" }
2026 = { location = "r2://market-radar/prices_eod_raw/2026.parquet", backend = "r2" }

[corporate_actions]
all = { location = "corporate_actions", backend = "supabase" }

# --- vendor endpoints -----------------------------------------------------
# Not storage. Recorded here so source modules never hold a literal URL, per
# the hard rule in CLAUDE.md and the test in tests/test_repo_invariants.py.

[tiingo_api]
base = { location = "https://api.tiingo.com", backend = "vendor_api" }

[tiingo_supported_tickers]
# Bulk ticker universe: exchange, asset type, and the date range Tiingo holds
# for each symbol. Free, no quota, not part of the 10k/hour request budget.
all = { location = "https://apimedia.tiingo.com/docs/tiingo/daily/supported_tickers.zip", backend = "vendor_api" }

[fred_api]
# St. Louis Fed. Free with a key (MR_FRED_API_KEY). Three series once a day is
# nowhere near any published limit, so this is not part of any request budget.
base = { location = "https://api.stlouisfed.org/fred", backend = "vendor_api" }

[resend_api]
# Transactional email for the daily digest. Not storage; recorded here so
# digest.py holds no literal endpoint, same as every other remote call.
send = { location = "https://api.resend.com/emails", backend = "vendor_api" }

[edgar]
# EDGAR endpoints. Not storage -- recorded here so the signal modules hold no
# literal URL, same as every other remote call.
#
# `current` is the near-real-time feed the sentinel polls: it returns only the
# last few hundred filings, so it is a tripwire, not a history.
# `daily_index` is the bulk file for a whole day, which is how a week is read
# back without several thousand requests.
# `archives` is the prefix every filing document hangs off.
current = { location = "https://www.sec.gov/cgi-bin/browse-edgar", backend = "vendor_api" }
daily_index = { location = "https://www.sec.gov/Archives/edgar/daily-index", backend = "vendor_api" }
archives = { location = "https://www.sec.gov/Archives", backend = "vendor_api" }

[dol_efast]
# DOL EFAST2 Form 5500 bulk datasets. Public domain, no key, refreshed monthly
# (Last-Modified was 2026-08-31 when this was added).
#
# TWO files per plan year, not one. `main` is the Form 5500 proper -- plans
# with 100+ participants, 225,591 filings for 2024. `short` is the 5500-SF,
# plans under 100 participants, 798,006 filings. The short form is three and a
# half times the main one and is where small private employers are, so a
# loader that reads only `main` has a quarter of the data and the wrong
# quarter.
#
# {year} is the plan year. Filings lag it: 2026 does not exist and 2025 is a
# third the size of 2024 because it is still being filed.
main = { location = "https://askebsa.dol.gov/FOIA%20Files/{year}/Latest/F_5500_{year}_Latest.zip", backend = "vendor_api" }
short = { location = "https://askebsa.dol.gov/FOIA%20Files/{year}/Latest/F_5500_SF_{year}_Latest.zip", backend = "vendor_api" }

[sec_financial_statements]
# SEC Financial Statement Data Sets: one zip per calendar quarter holding
# sub/num/pre/tag as tab-separated text. Public domain, no key, but SEC
# requires a descriptive User-Agent with a real contact address
# (MR_SEC_USER_AGENT).
#
# **Not companyfacts.zip**, and the reason is the whole point. These are values
# *as filed*, one row per accession, with each filing kept separately;
# companyfacts gives today's view of history with restatements folded in
# silently. An analog engine comparing a 2018 deal against 2018 fundamentals
# needs what was knowable in 2018, and only this can answer that. Same defect
# as the yfinance fundamentals rule in CLAUDE.md, which already cost a rule.
#
# {quarter} is e.g. 2024q1. ~44 downloads covers the eleven years the price
# history covers, at roughly 100 MB each.
quarterly = { location = "https://www.sec.gov/files/dera/data/financial-statement-data-sets/{quarter}.zip", backend = "vendor_api" }

[sec_files]
# CIK <-> ticker map for every SEC filer with a listed security. One small
# file, no key, but SEC requires a descriptive User-Agent with a real contact
# address (MR_SEC_USER_AGENT) and blocks traffic without one.
company_tickers = { location = "https://www.sec.gov/files/company_tickers.json", backend = "vendor_api" }

# --- public domain: GitHub Releases are fine ------------------------------
# Populated in Weekends 2-4. Locations are placeholders until the repo exists
# and the first release is cut; nothing reads them yet.

[sec_company_tickers]
# CIK <-> ticker map, republished from SEC. Public domain, so a GitHub
# Release is fine and correct: readable with no credentials.
all = { location = "https://github.com/eastonkellyclark-arch/market-radar/releases/download/reference-data/sec_company_tickers.parquet", backend = "github_release" }

[fred_series]
# Treasury yields and credit spreads. Postgres is the only home: FRED
# redistributes the ICE BofA series under permission and they are not ours to
# republish, so this dataset has no public mirror and sources/fred.py has no
# publish path at all. Decided 2026-09-08 — see CLAUDE.md.
all = { location = "macro_series", backend = "supabase" }

[form5500_sponsors]
# One row per (plan year, sponsor EIN), both forms merged. Public domain, so a
# GitHub Release is correct: DOL data is ours to republish, unlike anything
# Tiingo touched.
#
# Keyed on EIN, which is present on 100% of 1,023,597 filings. Sponsor names
# are carried for display and review only -- normalized-name matching scores
# 44.2% precision against EIN ground truth, so it is never a join key. See
# the identifier rule in CLAUDE.md.
2022 = { location = "https://github.com/eastonkellyclark-arch/market-radar/releases/download/form5500/form5500_sponsors_2022.parquet", backend = "github_release" }
2023 = { location = "https://github.com/eastonkellyclark-arch/market-radar/releases/download/form5500/form5500_sponsors_2023.parquet", backend = "github_release" }
2024 = { location = "https://github.com/eastonkellyclark-arch/market-radar/releases/download/form5500/form5500_sponsors_2024.parquet", backend = "github_release" }
2025 = { location = "https://github.com/eastonkellyclark-arch/market-radar/releases/download/form5500/form5500_sponsors_2025.parquet", backend = "github_release" }

[xbrl_fundamentals]
# One row per (accession, concept) -- **long, not wide**, and that is a
# decision rather than a convenience. Individually these concepts clear 98%;
# all six on the same filer is 64%. A consumer asking for revenue and net
# income should pay the coverage cost of revenue and net income, not of six it
# never reads, and a wide table makes that impossible to express.
#
# Partitioned by source quarter, which is also the download unit: re-running
# one quarter is cheap, and no partition ever has to be filtered out of another
# quarter's rows. The whole eleven years is under a million rows.
#
# SEC data is public domain, so a GitHub Release is correct.
2024q1 = { location = "https://github.com/eastonkellyclark-arch/market-radar/releases/download/xbrl/xbrl_fundamentals_2024q1.parquet", backend = "github_release" }
2023q1 = { location = "https://github.com/eastonkellyclark-arch/market-radar/releases/download/xbrl/xbrl_fundamentals_2023q1.parquet", backend = "github_release" }
2022q1 = { location = "https://github.com/eastonkellyclark-arch/market-radar/releases/download/xbrl/xbrl_fundamentals_2022q1.parquet", backend = "github_release" }
2021q1 = { location = "https://github.com/eastonkellyclark-arch/market-radar/releases/download/xbrl/xbrl_fundamentals_2021q1.parquet", backend = "github_release" }
2020q1 = { location = "https://github.com/eastonkellyclark-arch/market-radar/releases/download/xbrl/xbrl_fundamentals_2020q1.parquet", backend = "github_release" }
2019q1 = { location = "https://github.com/eastonkellyclark-arch/market-radar/releases/download/xbrl/xbrl_fundamentals_2019q1.parquet", backend = "github_release" }

[entity_review]
# The review queue: sponsors whose *name* matched an SEC filer while their
# EIN did not. Working state with writes, so Postgres rather than Parquet.
all = { location = "entity_review", backend = "supabase" }
