# Dataset locations. Configuration, not observation — row counts and max dates
# live in Postgres (dataset_stats), written nightly by the loaders.
#
# Moving a dataset is an edit here and nothing else. Nothing in the codebase
# hardcodes a data URL.
#
# backend must be one of: r2 | github_release | supabase | local
#
# LICENSING BOUNDARY (see CLAUDE.md): anything a vendor touched goes to "r2",
# which is private. Only public-domain government data may use
# "github_release", because Release assets on a public repo are world-readable
# and publishing them is redistribution.

# --- vendor-derived: private, R2 only -------------------------------------

[prices_eod_raw]
# Raw unadjusted OHLCV from Tiingo. Adjustment happens at query time against
# corporate_actions, which keeps history immutable and year partitions honest.
2026 = { location = "r2://market-radar/prices_eod_raw/2026.parquet", backend = "r2" }

[corporate_actions]
all = { location = "corporate_actions", backend = "supabase" }

# --- vendor endpoints -----------------------------------------------------
# Not storage. Recorded here so source modules never hold a literal URL, per
# the hard rule in CLAUDE.md and the test in tests/test_repo_invariants.py.

[tiingo_api]
base = { location = "https://api.tiingo.com", backend = "vendor_api" }

[tiingo_supported_tickers]
# Bulk ticker universe: exchange, asset type, and the date range Tiingo holds
# for each symbol. Free, no quota, not part of the 10k/hour request budget.
all = { location = "https://apimedia.tiingo.com/docs/tiingo/daily/supported_tickers.zip", backend = "vendor_api" }

[fred_api]
# St. Louis Fed. Free with a key (MR_FRED_API_KEY). Three series once a day is
# nowhere near any published limit, so this is not part of any request budget.
base = { location = "https://api.stlouisfed.org/fred", backend = "vendor_api" }

[resend_api]
# Transactional email for the daily digest. Not storage; recorded here so
# digest.py holds no literal endpoint, same as every other remote call.
send = { location = "https://api.resend.com/emails", backend = "vendor_api" }

[sec_files]
# CIK <-> ticker map for every SEC filer with a listed security. One small
# file, no key, but SEC requires a descriptive User-Agent with a real contact
# address (MR_SEC_USER_AGENT) and blocks traffic without one.
company_tickers = { location = "https://www.sec.gov/files/company_tickers.json", backend = "vendor_api" }

# --- public domain: GitHub Releases are fine ------------------------------
# Populated in Weekends 2-4. Locations are placeholders until the repo exists
# and the first release is cut; nothing reads them yet.

[sec_company_tickers]
# CIK <-> ticker map, republished from SEC. Public domain, so a GitHub
# Release is fine and correct: readable with no credentials.
all = { location = "https://github.com/eastonkellyclark-arch/market-radar/releases/download/reference-data/sec_company_tickers.parquet", backend = "github_release" }

[fred_series]
# Treasury yields and credit spreads from FRED.
#
# LICENSING NOTE, unresolved: DGS10 is US Treasury data and unambiguously
# public domain. The two BAMLxxx series are ICE BofA indices that FRED
# redistributes under permission from ICE Data Indices, LLC -- they are not
# themselves government-produced. Publishing them as a public Release asset is
# redistribution of a third-party index, which is the exact question the
# licensing rule in CLAUDE.md exists to force. Flagged for a decision; nothing
# is published to this location until it is settled.
all = { location = "https://github.com/eastonkellyclark-arch/market-radar/releases/download/reference-data/fred_series.parquet", backend = "github_release" }
